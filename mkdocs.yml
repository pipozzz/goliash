site_name: Goliash
site_description: What runs where, on which version — across Kubernetes, ECS, Nomad, Docker Swarm and Docker.
site_url: https://pipozzz.github.io/goliash/
repo_url: https://github.com/pipozzz/goliash
repo_name: pipozzz/goliash
edit_uri: edit/main/docs/
copyright: Server AGPL-3.0-only · agent Apache-2.0

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Install:
      - Overview: install/index.md
      - Kubernetes: install/kubernetes.md
      - Docker and Compose: install/docker.md
      - Docker Swarm: install/swarm.md
      - Nomad: install/nomad.md
      - Amazon ECS: install/ecs.md
  - Guide:
      - Matrix and mapping: guide/matrix.md
      - Versions and drift: guide/versions.md
      - Notifications: guide/notifications.md
      - Teams and workspaces: guide/teams.md
  - Reference:
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
      - REST API: reference/api.md
      - Collectors: reference/collectors.md
      - Agent protocol: reference/agent-protocol.md
  - Security: security.md

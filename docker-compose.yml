#
# Quickstart: the server with SQLite, on http://localhost:8080.
#
#   docker compose up -d --build
#   docker compose exec goliash goliash demo                         # optional: example data
#   docker compose exec goliash goliash login-link -email you@example.com
#
# To also watch the containers on this Docker host, start the read-only socket proxy
# and add a docker target that the server collects itself (no agent needed):
#
#   docker compose --profile watch-host up -d --build
#   docker compose exec goliash goliash env create -name prod -position 30
#   docker compose exec goliash goliash target create -env prod -platform docker -name this-host \
#     -settings '{"docker":{"docker_host":"tcp://socket-proxy:2375"}}'
#
# For other hosts, run an agent there: deploy/docker/goliash-agent.yml.
# For PostgreSQL, set GOLIASH_DATABASE_URL to a postgres:// URL.
services:
  goliash:
    build:
      context: .
      target: server
    image: goliash:local
    ports:
      - "8080:8080"
    environment:
      GOLIASH_PUBLIC_URL: http://localhost:8080
    volumes:
      - goliash-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/goliash", "healthcheck"]
      interval: 30s

  # Read-only view of the Docker API: GET on containers and images, nothing else.
  # Not published on any port; only the goliash service reaches it.
  socket-proxy:
    profiles: [watch-host]
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      IMAGES: 1        # registry digests of running images
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  goliash-data:

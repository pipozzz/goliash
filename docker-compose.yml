#
# Quickstart: the server with SQLite, on http://localhost:8080.
#
#   curl -fsSLO https://raw.githubusercontent.com/pipozzz/goliash/main/docker-compose.yml
#   docker compose up -d
#   docker compose logs goliash | grep link=     # open it to create your account
#
# Then Connect in the web UI adds what to watch. Optional example data:
#   docker compose exec goliash goliash demo
#
# To also watch the containers on this Docker host, start the read-only socket proxy
# (docker compose --profile watch-host up -d) and connect a Docker host collected by
# this server at tcp://socket-proxy:2375.
#
# GOLIASH_VERSION pins the image (e.g. 1.0.0); GOLIASH_PUBLIC_URL is the address people
# use. For PostgreSQL, set GOLIASH_DATABASE_URL to a postgres:// URL. To build from a
# checkout instead: docker build --target server -t ghcr.io/pipozzz/goliash:latest .
services:
  goliash:
    image: ghcr.io/pipozzz/goliash:${GOLIASH_VERSION:-latest}
    ports:
      - "8080:8080"
    environment:
      GOLIASH_PUBLIC_URL: ${GOLIASH_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - goliash-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/goliash", "healthcheck"]
      interval: 30s

  # Read-only view of the Docker API: GET on containers and images, nothing else.
  # Not published on any port; only the goliash service reaches it.
  socket-proxy:
    profiles: [watch-host]
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      IMAGES: 1        # registry digests of running images
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  goliash-data:

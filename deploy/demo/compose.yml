#
# A public, read-only Goliash demo: example data, every visitor signed in as a
# viewer, nothing kept. The server stops after an hour and the restart brings fresh
# data. Put it behind a reverse proxy with TLS at the address in -public-url.
#
# Dokploy: Create Service → Compose → Raw (paste this file) or Git (this path),
# then Domains → demo.goliash.dev, service "demo", port 8080, HTTPS on, and Deploy.
# Plain Docker: `docker compose -f compose.yml up -d` (publishes 8080 on a free host port;
# use "8080:8080" to pin it).
#
# Everything is set in the environment (Dokploy → Environment, or an .env file next to
# this one); unset variables keep the defaults below, and Goli stays off without a key.
#
#   GOLIASH_ARGS=try -public -reset 1h -public-url https://demo.goliash.dev
#   GOLIASH_TRUST_PROXY=true                      # limit questions per visitor, not per proxy
#
#   GOLIASH_AI_PROVIDER=openai                    # or anthropic (the default)
#   GOLIASH_AI_MODEL=gpt-6.1-sol
#   GOLIASH_AI_API_KEY=sk-…                       # a secret
#
#   GOLIASH_DEMO_GOLI=true                        # Goli over the demo's data
#   GOLIASH_AI_PER_HOUR=5                         # per visitor
#   GOLIASH_AI_PER_DAY=5                          # everyone together: a ceiling on the cost
#
#   GOLIASH_DOCS_ASSISTANT=https://goliash.dev/llms-full.txt   # Goli on goliash.dev
#   GOLIASH_DOCS_ASSISTANT_MODEL=gpt-6-luna       # a cheaper model for the docs
#   GOLIASH_DOCS_ASSISTANT_PER_DAY=60
services:
  demo:
    image: ghcr.io/pipozzz/goliash:latest
    command: ${GOLIASH_ARGS:-try -public -reset 1h -public-url https://demo.goliash.dev}
    environment:
      # The same, for platforms that drop `command`.
      GOLIASH_ARGS: ${GOLIASH_ARGS:-try -public -reset 1h -public-url https://demo.goliash.dev}
      GOLIASH_TRUST_PROXY: ${GOLIASH_TRUST_PROXY:-true}
      GOLIASH_AI_PROVIDER: ${GOLIASH_AI_PROVIDER:-}
      GOLIASH_AI_MODEL: ${GOLIASH_AI_MODEL:-}
      GOLIASH_AI_API_KEY: ${GOLIASH_AI_API_KEY:-}
      GOLIASH_DEMO_GOLI: ${GOLIASH_DEMO_GOLI:-false}
      GOLIASH_AI_PER_HOUR: ${GOLIASH_AI_PER_HOUR:-5}
      GOLIASH_AI_PER_DAY: ${GOLIASH_AI_PER_DAY:-5}
      GOLIASH_DOCS_ASSISTANT: ${GOLIASH_DOCS_ASSISTANT:-https://goliash.dev/llms-full.txt}
      GOLIASH_DOCS_ASSISTANT_MODEL: ${GOLIASH_DOCS_ASSISTANT_MODEL:-}
      GOLIASH_DOCS_ASSISTANT_PER_DAY: ${GOLIASH_DOCS_ASSISTANT_PER_DAY:-60}
    ports:
      - "8080"
    restart: always
    read_only: true
    tmpfs:
      - /tmp

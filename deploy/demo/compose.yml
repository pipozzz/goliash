#
# A public, read-only Goliash demo: example data, every visitor signed in as a
# viewer, nothing kept. The server stops after an hour and the restart brings fresh
# data. Put it behind a reverse proxy with TLS at the address in -public-url.
#
# Dokploy: Create Service → Compose → Raw (paste this file) or Git (this path),
# then Domains → demo.goliash.dev, service "demo", port 8080, HTTPS on, and Deploy.
# Plain Docker: `docker compose -f compose.yml up -d` (publishes 8080 on a free host port;
# use "8080:8080" to pin it).
# Platforms that drop `command` (some compose-to-scheduler converters): set the
# environment variable GOLIASH_ARGS to the same words instead.
services:
  demo:
    image: ghcr.io/pipozzz/goliash:latest
    command: try -public -reset 1h -public-url https://demo.goliash.dev
    environment:
      # The same, for platforms that drop `command`.
      GOLIASH_ARGS: try -public -reset 1h -public-url https://demo.goliash.dev
      # Goli on goliash.dev answers questions from the documentation through this server (optional).
      # GOLIASH_AI_API_KEY: sk-ant-…   (a secret: set it in the platform's secret settings, not here)
      GOLIASH_DOCS_ASSISTANT: https://goliash.dev/llms-full.txt
      GOLIASH_TRUST_PROXY: "true"     # behind the platform's proxy: limit questions per visitor, not per proxy
    ports:
      - "8080"
    restart: always
    read_only: true
    tmpfs:
      - /tmp

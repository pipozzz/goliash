{{- if not .Values.token.existingSecret }}
{{- if not .Values.token.value }}
{{- fail "set token.existingSecret (recommended) or token.value to the agent token (glsh_agent_…)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.fullname" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.token.value | quote }}
{{- end }}

image:
  repository: ghcr.io/pipozzz/goliash-agent
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Goliash server URL, reachable from this cluster (outbound HTTPS only).
serverURL: https://goliash.example.com

# The agent token (glsh_agent_…), from an existing secret (recommended) or a value.
token:
  existingSecret: ""
  existingSecretKey: token
  value: ""

# Secret with credentials for other targets this agent collects; every key becomes a
# file in /etc/goliash-agent/credentials (a target's credentials_ref names the key).
credentialsSecret: ""

# Credentials for private image registries, used to check them for new versions:
registry:
  # A kubernetes.io/dockerconfigjson secret (an existing image pull secret) in the
  # agent's namespace, mounted as the agent's Docker config. Needs no extra RBAC.
  dockerConfigSecret: ""

serviceAccount:
  # E.g. eks.amazonaws.com/role-arn for an IAM role (IRSA) with ecr:ListImages, so the
  # agent can check private ECR repositories.
  annotations: {}

rbac:
  # A ClusterRole with get, list and watch on Deployments, ReplicaSets, StatefulSets,
  # DaemonSets, CronJobs, Jobs and Pods. Nothing else.
  create: true
  # Also get Secrets, to read the image pull secrets that running pods reference and
  # check private registries with them. Only those secrets are read, and only by
  # name, but Kubernetes RBAC cannot narrow get to them: it grants get on every secret.
  readPullSecrets: false

# Buffered snapshots survive restarts only with a persistent volume.
persistence:
  enabled: false
  size: 256Mi
  storageClass: ""

debug: false
env: {}

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 256Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}

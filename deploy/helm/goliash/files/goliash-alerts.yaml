#
# Prometheus alerting rules for Goliash /metrics. Load with rule_files: in prometheus.yml,
# or let the Helm chart create a PrometheusRule (metrics.prometheusRule.enabled).
# Alerts about versions themselves (new releases, drift, removed services) are better sent by
# Goliash directly: see https://goliash.dev/guide/notifications/.
groups:
  - name: goliash
    rules:
      - alert: GoliashMetricsMissing
        expr: absent(goliash_build_info)
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: Goliash /metrics is not scraped
          description: No Goliash metrics for 10 minutes. The server is down, or the scrape fails (check the token).
      - alert: GoliashBackgroundWork
        expr: sum(goliash_leader) != 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $value }} Goliash servers run the background work"
          description: Exactly one server per database must run checks, notifications and clean-up.
      - alert: GoliashAgentStale
        expr: goliash_agents{status="stale"} > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} Goliash agents stopped reporting"
          description: Their targets keep their last known state. See Settings → Agents and targets.
      - alert: GoliashFallingBehind
        expr: goliash_snapshots_pending > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} Goliash snapshots wait to be processed"
          description: The server falls behind the agents; give it more CPU or check the database.
      - alert: GoliashNotificationsFailing
        expr: goliash_notifications_failing > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} Goliash notifications keep failing"
          description: The Notifications page shows each channel's answer.
      - alert: GoliashDriftOpenLong
        expr: max by (service, environment, kind) (goliash_drift_days) > 14
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "{{ $labels.service }} in {{ $labels.environment }}: {{ $labels.kind }} drift open for {{ $value | humanize }} days"
          description: Upgrade, or acknowledge it in Goliash if it is on purpose.
      - alert: GoliashEndOfLifeInProduction
        expr: goliash_end_of_life{state="passed"} > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} services in {{ $labels.environment }} run a release cycle past its end of life"
          description: They get no more fixes. See Security in Goliash for which ones and what to move to.
      - alert: GoliashExposedLong
        expr: goliash_exposures{over_days="90"} > 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "{{ $value }} services in {{ $labels.environment }} have run behind an available release for 90+ days"
          description: Security in Goliash lists them with the version that fixes each; Explain asks Goli what it would take.
      - alert: GoliashVulnerabilityPastDue
        expr: goliash_vulnerabilities_past_due > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} exploited vulnerabilities run in {{ $labels.environment }} past CISA's due date"
          description: CISA lists them as exploited in the wild and set a date for fixing them (BOD 22-01), which has passed. Security → Vulnerabilities in Goliash lists them with the version that fixes each.
      - alert: GoliashRolloutStuck
        expr: goliash_rollout_problem{kind=~"down|stuck"} == 1
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} in {{ $labels.environment }} on {{ $labels.target }}: {{ $labels.kind }} ({{ $labels.running }} of {{ $labels.desired }} replicas)"
          description: The workload runs none of the replicas it asks for, or two versions side by side for more than 30 minutes. Delivery in Goliash shows which versions run where; check the new version's logs and events.
      - alert: GoliashImageGrew
        expr: |
          goliash_image_size_bytes > 1.25 * (goliash_image_size_bytes offset 1d)
          and goliash_image_size_bytes - (goliash_image_size_bytes offset 1d) > 20e6
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "The {{ $labels.service }} image in {{ $labels.environment }} grew by a quarter or more in a day"
          description: A heavier base, a new dependency or build tools left in the image. The service page in Goliash charts its size per deploy; Ask Goli what changed.
      - alert: GoliashImageOverBudget
        expr: goliash_image_size_bytes > on (service) group_left max by (service) (goliash_image_size_budget_bytes)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The {{ $labels.service }} image in {{ $labels.environment }} is over its size budget"
          description: The image is larger than max_size_mb in the service's version policy. The service page in Goliash shows which layers made it bigger.
      - alert: GoliashImageBaseOutdated
        expr: goliash_image_base_behind_days > 30
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The {{ $labels.service }} image in {{ $labels.environment }} is built on a base {{ $value | humanize }} days old"
          description: Its base tag has had a newer build for over a month, so fixes in the base are not in the image even though the image itself may be new. Rebuild with --pull.
      - alert: GoliashImageEvidenceLost
        expr: goliash_image_evidence == 0 and (goliash_image_evidence offset 1d) == 1
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "The {{ $labels.service }} image in {{ $labels.environment }} lost its {{ $labels.kind }}"
          description: The running image has no {{ $labels.kind }} though the one a day earlier had. Check the build pipeline's signing, SBOM or provenance step.

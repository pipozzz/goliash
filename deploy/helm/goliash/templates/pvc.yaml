{{- if and .Values.persistence.enabled (not .Values.database.url) (not .Values.database.existingSecret) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "goliash.fullname" . }}
  labels: {{- include "goliash.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # the database survives helm uninstall
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.persistence.size }} }
{{- end }}

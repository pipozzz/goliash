{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "goliash.fullname" . }}
  labels:
    {{- include "goliash.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels: {{- include "goliash.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.serviceMonitor.tokenSecret }}
          key: {{ .Values.metrics.serviceMonitor.tokenSecretKey }}
{{- end }}

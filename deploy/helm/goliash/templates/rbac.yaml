{{- if .Values.collectInCluster }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "goliash.fullname" . }}
  labels: {{- include "goliash.labels" . | nindent 4 }}
---
# Read-only: the server never creates, changes or deletes anything in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "goliash.fullname" . }}-collect
  labels: {{- include "goliash.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "goliash.fullname" . }}-collect
  labels: {{- include "goliash.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "goliash.fullname" . }}-collect
subjects:
  - kind: ServiceAccount
    name: {{ include "goliash.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if include "goliash.generatesSecretKey" . }}
{{- $name := printf "%s-secret-key" (include "goliash.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The key that encrypts secrets at rest. Generated once; upgrades keep it, and so does an uninstall: the
# database's encrypted values need it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "goliash.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" }}
  {{- else }}
  secret-key: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}

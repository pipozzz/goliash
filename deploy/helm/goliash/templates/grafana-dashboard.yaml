{{- if .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goliash.fullname" . }}-dashboard
  labels:
    {{- include "goliash.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- with .Values.metrics.grafanaDashboard.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  goliash.json: |-
{{ .Files.Get "files/goliash-dashboard.json" | indent 4 }}
{{- end }}

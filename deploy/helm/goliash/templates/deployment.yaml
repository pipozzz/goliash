apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goliash.fullname" . }}
  labels: {{- include "goliash.labels" . | nindent 4 }}
spec:
  {{- $postgres := or .Values.database.url .Values.database.existingSecret }}
  {{- if and (not $postgres) (gt (int .Values.replicaCount) 1) }}
  {{- fail "replicaCount above 1 needs PostgreSQL (database.url or database.existingSecret): SQLite allows one server" }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  {{- if $postgres }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  {{- else }}
  strategy: { type: Recreate }   # SQLite on one volume: the old server stops first
  {{- end }}
  selector:
    matchLabels: {{- include "goliash.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "goliash.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.collectInCluster }}
      serviceAccountName: {{ include "goliash.fullname" . }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: goliash
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve, -keep-snapshots, {{ .Values.keepSnapshots | quote }}]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: GOLIASH_LISTEN, value: ":8080" }
            - { name: GOLIASH_PUBLIC_URL, value: {{ .Values.publicURL | quote }} }
            - { name: GOLIASH_LOG_FORMAT, value: {{ .Values.logFormat | quote }} }
            # On shutdown, fail readiness first so the Service stops sending before connections close.
            - { name: GOLIASH_DRAIN, value: "5s" }
            {{- if .Values.database.existingSecret }}
            - name: GOLIASH_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.existingSecretKey }} }
            {{- else if .Values.database.url }}
            - { name: GOLIASH_DATABASE_URL, value: {{ .Values.database.url | quote }} }
            {{- else }}
            - { name: GOLIASH_DATABASE_URL, value: /data/goliash.db }
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- with .Values.envFromSecret }}
          envFrom:
            - secretRef: { name: {{ . }} }
          {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          {{- if and .Values.persistence.enabled (not .Values.database.url) (not .Values.database.existingSecret) }}
          persistentVolumeClaim: { claimName: {{ include "goliash.fullname" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "goliash.fullname" . }}
  labels:
    {{- include "goliash.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
{{ .Files.Get "files/goliash-alerts.yaml" | indent 2 }}
{{- end }}

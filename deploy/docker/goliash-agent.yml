#
# goliash-agent for a standalone Docker host (plain containers and Compose projects).
# The agent reads the Docker API through docker-socket-proxy, which allows only GET
# on containers and images.
#
#   export GOLIASH_SERVER_URL=https://goliash.example.com
#   export GOLIASH_AGENT_TOKEN=glsh_agent_…
#   docker compose -f goliash-agent.yml up -d
#
# In Goliash, create a docker target for this agent with
#   {"docker":{"docker_host":"tcp://socket-proxy:2375"}}
#
# Compose services are reported per project and service (label goliash.service on a
# service overrides the name); other containers are reported by container name.
name: goliash-agent
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      IMAGES: 1        # registry digests of running images
      POST: 0          # read-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  agent:
    image: ghcr.io/pipozzz/goliash-agent:${GOLIASH_AGENT_VERSION:-latest}
    environment:
      GOLIASH_SERVER_URL: ${GOLIASH_SERVER_URL:?set GOLIASH_SERVER_URL}
      GOLIASH_AGENT_TOKEN: ${GOLIASH_AGENT_TOKEN:?set GOLIASH_AGENT_TOKEN}
      # Check private registries with this host's `docker login` (and the volume below).
      # DOCKER_CONFIG: /etc/goliash-agent/docker
    volumes:
      - agent-data:/data
      # - /root/.docker/config.json:/etc/goliash-agent/docker/config.json:ro
    depends_on: [socket-proxy]
    restart: unless-stopped

volumes:
  agent-data:

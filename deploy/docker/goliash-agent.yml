#
# goliash-agent for a standalone Docker host (plain containers and Compose projects).
# The agent reads the Docker API through docker-socket-proxy, which allows only GET
# on containers and images.
#
# Connect in Goliash gives the commands: they keep this file as ~/goliash-agent/compose.yml with an
# .env next to it (GOLIASH_SERVER_URL, GOLIASH_AGENT_TOKEN, GOLIASH_AGENT_VERSION), then
#   cd ~/goliash-agent && docker compose up -d
#
# The agent finds by itself what it can read: the containers and Compose projects, the host's OS and
# packages (its root, mounted read-only below; remove the line to leave them out), and on EC2 the AWS
# services the instance's role may read. It looks again every 15 minutes.
#
# With an enrollment code the agent registers itself and adds this host as a docker
# target. With an agent token (glsh_agent_…) instead, create the target in Goliash:
#   {"docker":{"docker_host":"tcp://socket-proxy:2375"}}
#
# Compose services are reported per project and service (label goliash.service on a
# service overrides the name); other containers are reported by container name.
name: goliash-agent
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      IMAGES: 1        # registry digests of running images
      INFO: 1          # the engine ID, which tells this host apart when the agent enrolls
      POST: 0          # read-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  agent:
    image: ghcr.io/pipozzz/goliash-agent:${GOLIASH_AGENT_VERSION:-latest}
    environment:
      GOLIASH_SERVER_URL: ${GOLIASH_SERVER_URL:?set GOLIASH_SERVER_URL}
      GOLIASH_AGENT_TOKEN: ${GOLIASH_AGENT_TOKEN:?set GOLIASH_AGENT_TOKEN to the enrollment code}
      DOCKER_HOST: tcp://socket-proxy:2375
      GOLIASH_HOST_ROOT: /host
      # Check private registries with this host's `docker login` (and the volume below).
      # DOCKER_CONFIG: /etc/goliash-agent/docker
    volumes:
      - agent-data:/data
      - /:/host:ro   # the host's OS and packages, read by a non-root user
      # - /root/.docker/config.json:/etc/goliash-agent/docker/config.json:ro
    # A trial server on this machine (GOLIASH_SERVER_URL=http://host.docker.internal:8080) is
    # reachable from the container through the host; Docker Desktop knows the name already.
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [socket-proxy]
    restart: unless-stopped

volumes:
  agent-data:

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert

  exclusions:
    rules:
      # Test servers echo input and redirect on purpose.
      - path: _test\.go
        linters: [gosec]
        text: "G705|G710|G124"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pipozzz/goliash

openapi: 3.0.3
info:
  title: Goliash API
  version: 1.0.0
  description: |
    Read what runs where, on which version, and acknowledge releases and drift.

    - Authenticate with `Authorization: Bearer glsh_api_…` (an API token from **Users → API tokens**) or a browser
      session. A token belongs to one workspace; every response is about that workspace.
    - `GET` endpoints need the viewer role, `POST /api/v1/acks` the member role. An API token has the role
      chosen when it was created: viewer (the default) or member.
    - Errors use `application/problem+json` (RFC 9457).
    - Prometheus metrics for the same data are at `GET /metrics` (text exposition, same authentication).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://goliash.example.com
security:
  - apiToken: []
  - session: []

paths:
  /api/v1/matrix:
    get:
      operationId: getMatrix
      summary: The service × environment matrix
      description: |
        Every service with the versions running in each environment, open drift and the newest upstream version.
        With `at`, the matrix as it was then, without drift and upstream data.
      parameters:
        - $ref: '#/components/parameters/At'
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matrix'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/services:
    get:
      operationId: listServices
      summary: Services
      responses:
        "200":
          description: Services by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{name}/release-notes:
    get:
      operationId: getReleaseNotes
      summary: What changed between two versions of a service
      description: >-
        The release notes of every release after `from` up to and including `to`, newest first, read from the
        GitHub or GitLab releases the service's policy, its image's source label or the catalog names. At most
        25 releases and 80 KiB of notes; `omitted` counts the rest.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, description: "The version running now; notes start after it. Empty: only to's notes.", schema: { type: string, example: "1.27.2" } }
        - { name: to, in: query, description: "The version to move to; default the newest upstream release.", schema: { type: string } }
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                type: object
                required: [service, to, releases]
                properties:
                  service: { type: string }
                  from: { type: string }
                  to: { type: string }
                  source: { type: string, description: "github:owner/repo or gitlab:host/project; absent when none is known", example: "github:nginx/nginx" }
                  changelog: { type: string, description: "The changelog of to, when its notes live outside a forge." }
                  omitted: { type: integer }
                  releases:
                    type: array
                    items:
                      type: object
                      required: [version, notes]
                      properties:
                        version: { type: string }
                        url: { type: string }
                        published_at: { type: string, format: date-time }
                        notes: { type: string, description: "Markdown, as the project wrote it." }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{name}/images:
    get:
      operationId: getServiceImages
      summary: What a service's images are made of
      description: >-
        Per environment, the running main image's size against the service's size budget (`max_size_mb`), its base
        and whether that base has a newer build, and its supply-chain evidence; every image that ran in the last 90
        days with its size; and what the last deploy (production first) changed in the layers, biggest first, with
        the Dockerfile step that made each. Sizes, bases and layers appear once the image's registry was read.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The images.
          content:
            application/json:
              schema:
                type: object
                required: [service, images, history]
                properties:
                  service: { type: string }
                  budget_bytes: { type: integer, format: int64, description: "The size budget; absent without one." }
                  images:
                    type: array
                    items:
                      type: object
                      required: [environment, image, digest]
                      properties:
                        environment: { type: string }
                        image: { type: string }
                        version: { type: string }
                        digest: { type: string }
                        size_bytes: { type: integer, format: int64, description: "What pulling it downloads: compressed layers and config." }
                        over_budget: { type: boolean }
                        layers: { type: integer }
                        base_image: { type: string, example: "docker.io/library/node:22-alpine" }
                        base_status: { type: string, enum: [current, outdated] }
                        base_behind_days: { type: integer, description: "Days the base tag has had a newer build than the image is built on." }
                        evidence:
                          type: object
                          required: [signed, sbom, provenance]
                          properties:
                            signed: { type: boolean }
                            sbom: { type: boolean }
                            provenance: { type: boolean }
                  history:
                    type: array
                    items:
                      type: object
                      required: [environment, digest, since]
                      properties:
                        environment: { type: string }
                        version: { type: string }
                        digest: { type: string }
                        size_bytes: { type: integer, format: int64 }
                        since: { type: string, format: date-time }
                        until: { type: string, format: date-time, description: "Absent while it still runs." }
                  last_change:
                    type: object
                    required: [environment, from, to, before_bytes, after_bytes, added, removed, added_count, removed_count]
                    properties:
                      environment: { type: string }
                      from: { type: string }
                      to: { type: string }
                      before_bytes: { type: integer, format: int64 }
                      after_bytes: { type: integer, format: int64 }
                      added: { type: array, items: { $ref: '#/components/schemas/ImageLayer' } }
                      removed: { type: array, items: { $ref: '#/components/schemas/ImageLayer' } }
                      added_count: { type: integer, description: "All added layers; added lists the six biggest." }
                      removed_count: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/licenses:
    get:
      operationId: listLicenses
      summary: Licenses of the packages in running images
      description: >-
        Every package the SBOMs of running images list, with the license the SBOM names and its class, most
        demanding first: network copyleft (AGPL, SSPL), source-available (BUSL, Elastic), strong copyleft (GPL), weak
        copyleft (LGPL, MPL), unknown, permissive. An OR in a license expression counts as its least demanding
        choice, an AND as its most demanding part. Operating system packages (deb, apk, rpm) are marked `os`.
      parameters:
        - { name: format, in: query, description: "csv: one row per package and where it runs, for a license review.", schema: { type: string, enum: [json, csv], default: json } }
        - { name: environment, in: query, description: Only this environment., schema: { type: string } }
        - name: class
          in: query
          description: "Only this class, or attention: network copyleft, source-available, strong copyleft and unknown."
          schema: { type: string, enum: [attention, network-copyleft, source-available, strong-copyleft, weak-copyleft, unknown, permissive] }
        - { name: os, in: query, description: "false leaves out operating system packages.", schema: { type: boolean } }
        - { name: q, in: query, description: "A package name, purl, license or service.", schema: { type: string, example: "AGPL" } }
      responses:
        "200":
          description: The packages.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [images, images_with_sbom, counts, os_counts, complete, packages]
                properties:
                  images: { type: integer, description: Running images with a digest. }
                  images_with_sbom: { type: integer }
                  counts: { type: object, additionalProperties: { type: integer }, description: "Application packages per class." }
                  os_counts: { type: object, additionalProperties: { type: integer }, description: "Operating system packages per class." }
                  complete: { type: boolean, description: "false while SBOMs read before licenses were kept wait to be read again." }
                  packages:
                    type: array
                    items:
                      type: object
                      required: [purl, name, class, os, running_in]
                      properties:
                        purl: { type: string, example: "pkg:maven/com.itextpdf/itextpdf@5.5.13.3" }
                        name: { type: string }
                        version: { type: string }
                        license: { type: string, description: "As the SBOM names it, an SPDX expression; absent when it names none.", example: "AGPL-3.0-only" }
                        class: { type: string, enum: [network-copyleft, source-available, strong-copyleft, weak-copyleft, unknown, permissive] }
                        os: { type: boolean }
                        running_in:
                          type: array
                          items:
                            type: object
                            required: [service, environment]
                            properties:
                              service: { type: string }
                              environment: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/notifications/sent:
    get:
      operationId: listSentNotifications
      summary: What Goliash sent
      description: >-
        Alerts, digests and upgrade plans sent by any rule, newest first, each message once however many channels it
        went to: what the bell lists. At most 100 messages.
      parameters:
        - { name: since, in: query, description: "How far back: a duration like 24h or 30d, or an RFC 3339 time. Default: 7 days.", schema: { type: string } }
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [sent_at, title, mode, items]
                  properties:
                    sent_at: { type: string, format: date-time }
                    title: { type: string }
                    mode: { type: string, enum: [instant, daily, weekly], description: "The rule's delivery: at once or in a digest." }
                    items:
                      type: array
                      items:
                        type: object
                        required: [type, at, text]
                        properties:
                          type: { type: string, description: "An event type, update (upgrade plan), agent_stale or agent_back." }
                          service: { type: string }
                          app: { type: string }
                          owner: { type: string }
                          environment: { type: string }
                          target: { type: string }
                          from: { type: string }
                          to: { type: string }
                          note: { type: string }
                          at: { type: string, format: date-time }
                          text: { type: string }
                          url: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
  /api/v1/summary:
    get:
      operationId: getSummary
      summary: Goliash in a dozen numbers
      description: >-
        What the tiles show, for widgets (iPhone with Scriptable, Windows 11 Widgets, wall screens): services,
        drifting, updates waiting and how many have exploited vulnerabilities, production's exposure and end of life,
        stale targets.
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                type: object
                required: [workspace, production, services, drifting, updates, exploited, behind, median_exposure_days, behind_90_days, end_of_life_passed, stale_targets, generated_at, generated]
                properties:
                  workspace: { type: string }
                  production: { type: string, description: "The last environment." }
                  services: { type: integer }
                  drifting: { type: integer, description: "Services with open drift." }
                  updates: { type: integer, description: "Updates waiting, not put off by an acknowledgement." }
                  exploited: { type: integer, description: "Of them, how many run an image with a vulnerability exploited in the wild." }
                  behind: { type: integer, description: "Production services behind a newer release, not counting accepted risk." }
                  median_exposure_days: { type: integer }
                  behind_90_days: { type: integer }
                  end_of_life_passed: { type: integer }
                  stale_targets: { type: integer }
                  generated_at: { type: string, format: date-time }
                  generated: { type: string, description: "generated_at as text, e.g. Oct 14, 13:05 UTC." }
  /api/v1/posture:
    get:
      operationId: getPosture
      summary: The security posture
      description: >-
        How long production has run behind available releases, what is past or near its end of life, accepted risk
        and blind spots, with every exposure and the version that fixes it: the Security page as data, for risk
        registers, GRC tools and AI assistants.
      parameters:
        - { name: all, in: query, description: "true: exposures in every environment, not only production", schema: { type: boolean } }
      responses:
        "200":
          description: The posture.
          content:
            application/json:
              schema:
                type: object
                required: [production, services_running, median_exposure_days, p90_exposure_days, behind_30_days, behind_90_days, end_of_life_passed, end_of_life_soon, accepted_risk, stale_targets, no_known_upstream, exposures, history]
                properties:
                  production: { type: string, description: "The last environment, where exposure counts most." }
                  services_running: { type: integer }
                  median_exposure_days: { type: integer, description: "Over production exposures whose release dates are known." }
                  p90_exposure_days: { type: integer }
                  behind_30_days: { type: integer }
                  behind_90_days: { type: integer }
                  end_of_life_passed: { type: integer }
                  end_of_life_soon: { type: integer }
                  accepted_risk: { type: integer, description: "Production exposures quieted by an acknowledgement." }
                  stale_targets: { type: array, items: { type: string } }
                  no_known_upstream: { type: array, items: { type: string }, description: "Services whose exposure cannot be measured." }
                  outdated_base: { type: array, items: { type: string }, description: "Production services whose image is built on an older build of its base than the base's tag has now: rebuild with --pull." }
                  history:
                    type: array
                    description: "Production's posture once a week over the last 90 days, oldest first: is patching getting faster?"
                    items:
                      type: object
                      required: [day, behind, median_exposure_days, p90_exposure_days, behind_30_days, behind_90_days, end_of_life_passed, accepted_risk]
                      properties:
                        day: { type: string, format: date }
                        behind: { type: integer, description: "Production services behind a newer release, not counting accepted risk." }
                        median_exposure_days: { type: integer }
                        p90_exposure_days: { type: integer }
                        behind_30_days: { type: integer }
                        behind_90_days: { type: integer }
                        end_of_life_passed: { type: integer }
                        accepted_risk: { type: integer }
                  exposures:
                    type: array
                    items:
                      type: object
                      required: [service, environment, running, exposed_days, since, since_known, why, accepted]
                      properties:
                        service: { type: string }
                        app: { type: string }
                        environment: { type: string }
                        running: { type: string }
                        fix: { type: string, description: "The version to move to." }
                        release_notes: { type: string }
                        exposed_days: { type: integer }
                        since: { type: string, format: date-time }
                        since_known: { type: boolean, description: "false: counted from when Goliash first saw the newer release, a lower bound." }
                        why: { type: string }
                        end_of_life: { type: string }
                        accepted: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/environments:
    get:
      operationId: listEnvironments
      summary: Environments in promotion order
      responses:
        "200":
          description: Environments, lowest position first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Environment'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/targets:
    get:
      operationId: listTargets
      summary: Targets (clusters, regions, hosts) and their collectors
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Target'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/events:
    get:
      operationId: listEvents
      summary: History of deploys, releases and drift, newest first
      parameters:
        - name: service
          in: query
          description: Service name.
          schema: { type: string }
        - name: environment
          in: query
          description: Environment name.
          schema: { type: string }
        - name: type
          in: query
          description: Comma-separated event types.
          schema: { type: string, example: "version_changed,new_release" }
        - name: before
          in: query
          description: Only events before this time (RFC 3339), for paging with the last event's `at`.
          schema: { type: string, format: date-time }
        - name: since
          in: query
          description: Only events from this time on, as a duration back from now (`2h`, `30m`, `7d`) or RFC 3339.
          schema: { type: string, example: 2h }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/drifts:
    get:
      operationId: listDrifts
      summary: Open drift, oldest first
      responses:
        "200":
          description: Open drifts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drift'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/promotions:
    get:
      operationId: listPromotions
      summary: Versions waiting to be promoted, longest waiting first
      description: |
        An environment that runs something newer than the environment after it, with the releases a promotion
        would bring.
      responses:
        "200":
          description: Pending promotions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promotion'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/delivery:
    get:
      operationId: getDelivery
      summary: Delivery statistics per service
      description: |
        Versions that arrived in each environment within the window, and the median time a version took from one
        environment to the next, read from what ran when.
      parameters:
        - name: window
          in: query
          schema: { type: string, default: 30d, example: 7d }
      responses:
        "200":
          description: Statistics per service.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/inventory:
    get:
      operationId: getInventory
      summary: Every running container, for audits
      description: |
        Every container that runs now (or ran at `at`), sidecars included, with image, tag and digest.
        `format=cyclonedx` returns a CycloneDX 1.6 BOM instead: one component per image (an OCI purl and its
        digest, where it runs as `goliash:` properties) with the packages of its SBOM nested inside, where the
        registry holds one, ready for Dependency-Track or an auditor.
      parameters:
        - $ref: '#/components/parameters/At'
        - name: format
          in: query
          schema: { type: string, enum: [json, csv, cyclonedx], default: json }
        - name: environment
          in: query
          description: Only what runs in this environment, e.g. one Dependency-Track project per environment.
          schema: { type: string }
      responses:
        "200":
          description: The inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
            text/csv:
              schema: { type: string }
            application/vnd.cyclonedx+json:
              schema: { type: object, description: "A CycloneDX 1.6 JSON document." }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/status:
    get:
      operationId: getStatus
      summary: Goliash's own health
      description: |
        Whether Goliash itself works and its data is fresh, as Settings → Status shows it: one check per part
        (agents, targets, upstream releases, private registries, vulnerability data, notifications, Goliash's
        version) and the worst state. For monitors and assistants deciding whether an answer can be trusted.
      responses:
        "200":
          description: The checks.
          content:
            application/json:
              schema:
                type: object
                required: [checks, state, checked_at]
                properties:
                  state: { type: string, enum: [ok, warn, bad, off] }
                  checked_at: { type: string, format: date-time }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [title, state, summary]
                      properties:
                        title: { type: string }
                        state: { type: string, enum: [ok, warn, bad, off] }
                        summary: { type: string }
                        details: { type: array, items: { type: string } }
                        link: { type: string, description: "Where in the UI to look, relative to the server." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/updates:
    get:
      operationId: getUpdates
      summary: What to upgrade, most urgent first
      description: |
        One item per service (and application, for a service compared per application) and environment with open
        end-of-life, upstream or environment drift: what runs, the version to move to and why. Ordered by urgency
        (an exploited vulnerability in the running image, end of life, end of life soon, major, minor, behind the previous
        environment, patch), production first.
        Items an acknowledgement quiets are included with `acknowledged: true`.
      responses:
        "200":
          description: Updates, most urgent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [service, environment, running, urgency, since, acknowledged]
                  properties:
                    service: { type: string }
                    owner: { type: string }
                    app: { type: string }
                    environment: { type: string }
                    running: { type: string }
                    target: { type: string, description: "The version to move to." }
                    release_notes: { type: string, format: uri }
                    jump: { type: string, enum: [patch, minor, major] }
                    behind: { type: string, description: "The previous environment it is behind." }
                    eol: { type: string, format: date }
                    urgency: { type: string, enum: ["exploited vulnerability", "end of life", "end of life soon", major, minor, "behind previous env", patch] }
                    exploited:
                      type: array
                      items: { type: string }
                      description: Vulnerabilities in the running image that CISA lists as exploited in the wild, from its SBOM.
                    critical_vulnerabilities: { type: integer, description: "Other critical vulnerabilities in the running image." }
                    since: { type: string, format: date-time }
                    acknowledged: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/v1/hygiene:
    get:
      operationId: getHygiene
      summary: Image hygiene findings
      description: |
        Running images with a moving tag (latest, stable …), a tag pushed again (same tag, different digests),
        a registry outside `GOLIASH_ALLOWED_REGISTRIES`, or no known digest (info).
      responses:
        "200":
          description: Findings, warnings first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [kind, severity, image, detail, where]
                  properties:
                    kind: { type: string, enum: [moving-tag, retagged, untrusted-registry, unpinned] }
                    severity: { type: string, enum: [warning, info] }
                    image: { type: string }
                    detail: { type: string }
                    where:
                      type: array
                      items: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/vulnerabilities:
    get:
      operationId: getVulnerabilities
      summary: Known vulnerabilities of running images
      description: |
        Is a vulnerability running? From the SBOMs of running images and OSV: one finding per CVE (else advisory),
        with every advisory naming it, whether CISA lists it as exploited in the wild, and the packages and
        services it is in with the version that fixes each. `complete` is false while advisories or packages are
        still being looked up: an empty answer then does not mean "not running". Only images with an SBOM are
        covered (`images_with_sbom` of `images`).
      parameters:
        - { name: format, in: query, description: "csv: one row per vulnerability and affected image, with CISA due dates and fixes.", schema: { type: string, enum: [json, csv], default: json } }
        - { name: q, in: query, schema: { type: string }, description: 'A CVE or advisory ID, package or service; part of it matches' }
        - { name: environment, in: query, schema: { type: string }, description: Only this environment }
        - { name: exploited, in: query, schema: { type: boolean }, description: Only vulnerabilities exploited in the wild (CISA KEV) }
      responses:
        "200":
          description: Findings, exploited first, then by severity.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [images, images_with_sbom, packages, complete, findings]
                properties:
                  images: { type: integer }
                  images_with_sbom: { type: integer }
                  packages: { type: integer }
                  complete: { type: boolean }
                  findings:
                    type: array
                    items:
                      type: object
                      required: [id, advisories, aliases, fixable, affected]
                      properties:
                        id: { type: string, example: CVE-2021-44228 }
                        advisories: { type: array, items: { type: string } }
                        aliases: { type: array, items: { type: string } }
                        summary: { type: string }
                        severity: { type: string, example: critical }
                        exploited:
                          type: object
                          required: [ransomware]
                          properties:
                            due_date: { type: string }
                            date_added: { type: string }
                            ransomware: { type: boolean }
                            past_due: { type: boolean, description: "It still runs after the due date CISA set for fixing it (BOD 22-01)." }
                        fixable: { type: boolean }
                        running_since: { type: string, format: date-time, description: "Since when it has run: the earliest of the affected images." }
                        affected:
                          type: array
                          items:
                            type: object
                            required: [service, environment, image, package]
                            properties:
                              service: { type: string }
                              environment: { type: string }
                              image: { type: string }
                              package: { type: string, example: log4j-core 2.14.1 }
                              fix: { type: string, example: 2.15.0 }
                              since: { type: string, format: date-time, description: "Since when the image has run in the environment." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/acks:
    post:
      operationId: createAck
      summary: Acknowledge a release or a drift
      description: |
        Silences notifications for a service (optionally in one environment) until a version ships or a time passes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
      responses:
        "201":
          description: Acknowledged.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/openapi.yaml:
    get:
      operationId: getSpec
      summary: This specification
      security: []
      responses:
        "200":
          description: OpenAPI 3.0 document.
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: An API token (`glsh_api_…`).
    session:
      type: apiKey
      in: cookie
      name: goliash_session

  parameters:
    At:
      name: at
      in: query
      description: A point in the past, RFC 3339 or `2026-09-12T14:00` (UTC). History is kept for 400 days.
      schema: { type: string, example: "2026-09-12T14:00:00Z" }

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: No valid token or session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The role is not enough.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Unknown service or environment.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ImageLayer:
      type: object
      required: [size_bytes]
      properties:
        size_bytes: { type: integer, format: int64 }
        command: { type: string, description: "The build step that made it, from the image config's history.", example: "RUN apt-get install -y chromium" }
    Environment:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string }
        name: { type: string, example: prod }
        position:
          type: integer
          description: Promotion order; lower comes first (dev 10, staging 20, prod 30).

    Service:
      type: object
      required: [id, name, owner, kind, upstream, version_policy]
      properties:
        id: { type: string }
        name: { type: string, example: payments-api }
        owner: { type: string, example: team-payments }
        kind: { type: string, enum: [own, third_party] }
        upstream:
          type: string
          description: Image repository releases are read from; empty means the image the service runs.
        version_policy:
          $ref: '#/components/schemas/VersionPolicy'

    VersionPolicy:
      type: object
      description: The service's own policy; empty means the catalog's or the defaults.
      properties:
        track: { type: string, enum: [patch, minor, major] }
        pin_major: { type: integer }
        tag_filter: { type: string }
        prerelease: { type: boolean }
        drift_alert_after:
          type: object
          additionalProperties: { type: string }
          example: { env: 168h }
        github: { type: string, example: acme/payments }
        gitlab: { type: string, example: gitlab.com/acme/payments }
        eol: { type: string, example: postgresql, description: 'endoflife.date product; "none" turns end-of-life drift off' }
        github_tag_prefix: { type: string }
        changelog: { type: string }

    Target:
      type: object
      required: [id, name, platform, environment, collected_by]
      properties:
        id: { type: string }
        name: { type: string, example: prod-eu-1 }
        platform: { type: string, enum: [kubernetes, ecs, nomad, swarm, docker] }
        environment: { type: string }
        collected_by:
          type: string
          description: The agent's ID, or `server` when the server collects the target itself.
        last_snapshot_at: { type: string, format: date-time }
        collector_status: { type: string, enum: [ok, degraded, failing] }
        collector_error: { type: string }

    Version:
      type: object
      required: [tag, running, targets]
      properties:
        tag: { type: string, example: 1.27.3 }
        digest: { type: string }
        running:
          type: integer
          description: Running replicas.
        targets:
          type: array
          items: { type: string }

    DriftDetail:
      type: object
      required: [running, other]
      properties:
        running: { type: string }
        other:
          type: string
          description: The newer version, upstream's or the lower environment's.
        other_in:
          type: string
          description: The environment running `other` (env drift).
        jump: { type: string, enum: [patch, minor, major] }
        targets:
          type: object
          description: For inconsistent drift, the version per target.
          additionalProperties: { type: string }
        eol:
          type: string
          format: date
          description: For eol drift, when the release cycle (`other`) stops being supported.

    Drift:
      type: object
      required: [service, environment, kind, since, days_open, detail]
      properties:
        service: { type: string }
        environment: { type: string }
        app:
          type: string
          description: |
            The application, when the service is used by several and its versions are compared within each
            (one postgres image, many databases). Absent when the service drifts as a whole.
        kind:
          type: string
          enum: [env, upstream, inconsistent, declared, eol]
          description: |
            `env`: behind a lower environment. `upstream`: behind the newest release by the tracked jump.
            `inconsistent`: targets of one environment run different versions. `declared`: what runs differs
            from what the Compose files in Git declare. `eol`: the running release cycle reaches its end of life
            within 60 days or has reached it (endoflife.date).
        since: { type: string, format: date-time }
        days_open: { type: number }
        detail: { $ref: '#/components/schemas/DriftDetail' }

    Cell:
      type: object
      required: [environment, versions, drifts]
      properties:
        environment: { type: string }
        versions:
          type: array
          items: { $ref: '#/components/schemas/Version' }
        declared:
          type: array
          description: What Compose files (in Git) declare, when it is reported besides what runs.
          items: { $ref: '#/components/schemas/Version' }
        from_declared:
          type: boolean
          description: Nothing reports what runs; `versions` come from Compose files.
        drifts:
          type: array
          items: { $ref: '#/components/schemas/Drift' }

    MatrixRow:
      type: object
      required: [service, cells]
      properties:
        service: { type: string }
        owner: { type: string }
        upstream: { type: string }
        latest:
          type: string
          description: The newest upstream version the policy accepts.
        cells:
          type: array
          description: One per environment, in the order of `environments`.
          items: { $ref: '#/components/schemas/Cell' }

    Matrix:
      type: object
      required: [environments, services, unmapped]
      properties:
        environments:
          type: array
          items: { $ref: '#/components/schemas/Environment' }
        services:
          type: array
          items: { $ref: '#/components/schemas/MatrixRow' }
        unmapped:
          type: integer
          description: Running workloads not mapped to a service yet (the inbox).

    Event:
      type: object
      required: [id, type, source, at]
      properties:
        id: { type: string }
        type:
          type: string
          example: version_changed
          description: deployed, version_changed, removed, new_release, drift_detected, drift_resolved or agent_stale.
        service: { type: string }
        app: { type: string, description: "The application of a drift event, when the service is compared per application." }
        environment: { type: string }
        target: { type: string }
        from: { type: string }
        to: { type: string }
        note: { type: string, description: "retag (same version, new digest) or rollback (a version_changed to an older version); for drift, its kind." }
        source: { type: string, description: "Where the event came from, e.g. snapshot or poll." }
        at: { type: string, format: date-time }

    Promotion:
      type: object
      required: [service, from, to, version, running, since, releases]
      properties:
        service: { type: string }
        app: { type: string, description: "The application, for a service compared per application." }
        from: { type: string, description: The environment running the newer version. }
        to: { type: string, description: The environment behind. }
        version: { type: string, description: Waiting in `from`. }
        running: { type: string, description: Running in `to`. }
        since: { type: string, format: date-time }
        releases:
          type: array
          description: Releases after `running` up to `version`, newest first.
          items:
            type: object
            required: [version]
            properties:
              version: { type: string }
              published_at: { type: string, format: date-time }
              release_notes: { type: string }
        vulnerabilities:
          type: object
          description: >-
            What promoting does to the known vulnerabilities of `to`, comparing the SBOMs of the two versions' images on
            OSV: those it fixes and those it brings, exploited ones first. Absent unless both images have an SBOM.
          required: [fixed, new]
          properties:
            fixed: { type: array, items: { $ref: '#/components/schemas/VulnRef' } }
            new: { type: array, items: { $ref: '#/components/schemas/VulnRef' } }

    VulnRef:
      type: object
      required: [id, exploited]
      properties:
        id: { type: string, example: CVE-2021-44228 }
        severity: { type: string, example: CRITICAL }
        exploited: { type: boolean, description: CISA lists it as exploited in the wild. }

    Delivery:
      type: object
      required: [service, environments, lead_times]
      properties:
        service: { type: string }
        environments:
          type: array
          items:
            type: object
            required: [environment, deploys]
            properties:
              environment: { type: string }
              deploys: { type: integer, description: Versions that arrived within the window. }
              rollbacks: { type: integer, description: "Changes back to an older version within the window: with deploys, a change failure rate." }
              last_deploy: { type: string, format: date-time }
        lead_times:
          type: array
          items:
            type: object
            required: [from, to, median_seconds, samples]
            properties:
              from: { type: string }
              to: { type: string }
              median_seconds: { type: number }
              samples: { type: integer }

    InventoryItem:
      type: object
      required: [environment, target, platform, workload, kind, container, image, running, first_seen]
      properties:
        environment: { type: string }
        target: { type: string }
        platform: { type: string }
        service: { type: string }
        namespace: { type: string }
        workload: { type: string }
        kind: { type: string }
        container: { type: string }
        image: { type: string }
        tag: { type: string }
        digest: { type: string }
        running: { type: integer }
        first_seen: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: "What pulling the image downloads (compressed layers and config), when read." }
        base: { type: string, description: "The FROM image the image was compared with, e.g. docker.io/library/node:22-alpine." }
        base_status: { type: string, enum: [current, outdated], description: "outdated: built on an older build of its base than the base's tag has now (rebuild with --pull)." }

    AckRequest:
      type: object
      required: [service, kind]
      properties:
        service: { type: string }
        environment:
          type: string
          description: Empty acknowledges the service in every environment.
        kind: { type: string, enum: [release, drift] }
        until_version:
          type: string
          description: Quiet until this version runs. Set this or `until`.
        until:
          type: string
          format: date-time
          description: Quiet until this time.

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: License boundary
        run: ./scripts/check-licenses.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: goliash
          POSTGRES_PASSWORD: goliash
          POSTGRES_DB: goliash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goliash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOLIASH_TEST_POSTGRES_DSN: postgres://goliash:goliash@localhost:5432/goliash?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
      - run: go test -race -coverprofile=coverage.out ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build server and agent images from source
        run: |
          docker build --target server -t goliash:ci .
          docker build --target agent -t goliash-agent:ci .
          docker run --rm goliash:ci version
          docker run --rm goliash-agent:ci -version
      - name: goreleaser config is valid
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Helm charts lint and render
        run: |
          helm lint deploy/helm/goliash deploy/helm/goliash-agent --set token.value=glsh_agent_ci
          helm template t deploy/helm/goliash > /dev/null
          helm template t deploy/helm/goliash --set database.url=postgres://x > /dev/null
          helm template t deploy/helm/goliash-agent --set token.existingSecret=s > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform module is valid
        working-directory: deploy/ecs/goliash-agent
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request changes anything the jobs below check. One that only changes the documentation or the
  # Nomad pack (the release's version bump) skips them; a push to main runs them all. The slow jobs (Kubernetes
  # end to end, upgrades, images, deploy files) run on a pull request only when it touches what they test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      k8s: ${{ steps.diff.outputs.k8s }}
      upgrade: ${{ steps.diff.outputs.upgrade }}
      docker: ${{ steps.diff.outputs.docker }}
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            printf 'code=true\nk8s=true\nupgrade=true\ndocker=true\ndeploy=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ev '^(website/|deploy/nomad/pack/)|\.md$' || true)
          echo "$changed"
          has() { if printf '%s\n' "$changed" | grep -Eq "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          if [ -n "$changed" ]; then echo code=true >> "$GITHUB_OUTPUT"; else echo code=false >> "$GITHUB_OUTPUT"; fi
          has k8s '^(internal/collectors/kubernetes|internal/agent|internal/discover|internal/ingest|cmd/goliash-agent|pkg/agentproto|deploy/helm|scripts/e2e|go\.(mod|sum))'
          has upgrade '^(internal/store|go\.(mod|sum))'
          has docker '^(build/|deploy/docker/|docker-compose\.yml|\.goreleaser)'
          has deploy '^deploy/'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: License boundary
        run: ./scripts/check-licenses.sh
      - name: Known vulnerabilities in the code and the Go toolchain it is built with
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  # The race detector makes the tests slow; three shards of about equal length run side by side.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ui, store, rest]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: goliash
          POSTGRES_PASSWORD: goliash
          POSTGRES_DB: goliash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goliash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOLIASH_TEST_POSTGRES_DSN: postgres://goliash:goliash@localhost:5432/goliash?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: matrix.shard == 'rest'
        run: go mod tidy -diff
      - name: Generated code is up to date
        if: matrix.shard == 'rest'
        run: |
          go generate ./...
          git diff --exit-code
      # The race detector makes the tests several times slower: pull requests run without it, main with it.
      - name: go test (${{ matrix.shard }})
        env:
          RACE: ${{ github.event_name == 'push' && '-race' || '' }}
        run: |
          case "${{ matrix.shard }}" in
            ui) pkgs=$(go list ./internal/ui/...) ;;
            store) pkgs=$(go list ./internal/store/... ./internal/versions/... ./cmd/goliash) ;;
            rest) pkgs=$(go list ./... | grep -Ev '/internal/(ui|store|versions)(/|$)|/cmd/goliash$') ;;
          esac
          go test $RACE $pkgs

  # A database filled by an older release must migrate and keep its data: from the
  # first release and from the latest one, on SQLite and PostgreSQL.
  upgrade:
    needs: changes
    if: needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: goliash
          POSTGRES_PASSWORD: goliash
          POSTGRES_DB: goliash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goliash" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Upgrade from the first and the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest published release (a new tag's binaries may still be building).
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name | sed 's/^v//')
          for from in 0.1.0 "$latest"; do
            scripts/upgrade-test.sh "$from"
            db="up_${from//./_}"
            PGPASSWORD=goliash psql -h localhost -U goliash -d goliash -c "CREATE DATABASE $db"
            scripts/upgrade-test.sh "$from" "postgres://goliash:goliash@localhost:5432/$db?sslmode=disable"
          done
      - name: Older agents report to this server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name | sed 's/^v//')
          for from in 0.3.0 "$latest"; do   # 0.3.0: the first agent with the compose collector
            scripts/agent-compat-test.sh "$from"
          done

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build server and agent images from source
        run: |
          docker build --target server -t goliash:ci .
          docker build --target agent -t goliash-agent:ci .
          docker run --rm goliash:ci version
          docker run --rm goliash-agent:ci -version
      - name: goreleaser config is valid
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  e2e-kubernetes:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    # Server and agent installed with the Helm charts into a kind cluster; a rollout
    # must show up in the matrix and as a version_changed event.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: goliash-e2e
      - name: Kubernetes end-to-end test
        env:
          KIND_CLUSTER: goliash-e2e
        run: scripts/e2e/kubernetes.sh

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Helm charts lint and render
        run: |
          helm lint deploy/helm/goliash deploy/helm/goliash-agent --set token.value=glsh_agent_ci
          helm template t deploy/helm/goliash > /dev/null
          helm template t deploy/helm/goliash --set database.url=postgres://x > /dev/null
          helm template t deploy/helm/goliash --set database.url=postgres://x | grep -q 'name: t-goliash-secret-key'   # PostgreSQL: a generated key
          ! helm template t deploy/helm/goliash | grep -q GOLIASH_SECRET_KEY   # SQLite: the key file on the volume
          helm template t deploy/helm/goliash --set database.url=postgres://x --set replicaCount=2 | grep -q PodDisruptionBudget
          ! helm template t deploy/helm/goliash --set replicaCount=2 > /dev/null 2>&1   # SQLite: one server only
          helm template t deploy/helm/goliash-agent --set token.existingSecret=s > /dev/null
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform module is valid
        working-directory: deploy/ecs/goliash-agent
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: CloudFormation template is valid
        run: pipx run cfn-lint deploy/ecs/goliash-agent.cfn.yaml

  # Every release platform compiles, in one job: six jobs spent most of their time starting and waiting in line.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} make build
            echo "::endgroup::"
          done

  # The release compiles twelve binaries; from scratch that takes over ten minutes. On main, when the modules
  # change, compile them once into a cache the release workflow starts from (tags read main's caches).
  release-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: look
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-build-${{ hashFiles('go.sum', 'go.mod') }}
          lookup-only: true
      - if: steps.look.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - if: steps.look.outputs.cache-hit != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - if: steps.look.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-build-${{ hashFiles('go.sum', 'go.mod') }}

name: Release

# Push a tag like v0.1.0 to publish binaries, archives, SBOMs, signed multi-arch
# images (ghcr.io/pipozzz/goliash, ghcr.io/pipozzz/goliash-agent) and signed Helm
# charts (oci://ghcr.io/pipozzz/charts/goliash, …/goliash-agent).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub release
  packages: write   # GHCR images
  id-token: write   # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  charts:
    needs: release
    uses: ./.github/workflows/helm-charts.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write

#
# Global catalog of public images. Goliash uses an entry when a service runs one of
# these images and has no version policy of its own:
#
#   image:              registry/repository, as Goliash normalizes it (docker.io/library/nginx)
#   policy:             default version policy (track, pin_major, tag_filter, major_filter, prerelease, drift_alert_after)
#   github:             owner/repo whose GitHub releases give release dates and changelog links
#   gitlab:             gitlab.com/group/project whose GitLab releases give release dates and links
#   github_tag_prefix:  text before the version in release tags, e.g. "release-" (nginx); also for gitlab
#   changelog:          changelog URL for projects without GitHub releases; {version} is replaced
#   eol:                endoflife.date product, for images the site does not map to one itself
#   security:           a feed of which releases fix vulnerabilities, for projects whose release notes Goliash
#                       cannot read: php.net (its releases feed), go.dev (Go's release history), eol-phase (a
#                       release cycle in security-fixes-only support on endoflife.date: Python, Ruby). Releases
#                       whose notes, or own changelog page, name a CVE are known without it.
#   advisories:         a GitHub repository (owner/repo) whose security advisories say which versions a CVE affects,
#                       read before NVD, when releases come from elsewhere (php/php-src: PHP is released on php.net)
#   cpe:                the product in NVD, as CPE vendor:product (several when NVD used more than one): its CVEs
#                       are looked up by the running version, for products built into their image from source.
#
# Additions are welcome: one entry per image, sorted by image. `go test ./internal/versions/`
# checks every entry.

- image: docker.elastic.co/elasticsearch/elasticsearch
  cpe: [elastic:elasticsearch]
  eol: elasticsearch
  github: elastic/elasticsearch
  policy: { track: minor }
- image: docker.io/bitnami/redis
  cpe: [redis:redis]
  github: redis/redis
- image: docker.io/directus/directus
  github: directus/directus
- image: docker.io/envoyproxy/envoy
  cpe: [envoyproxy:envoy]
  github: envoyproxy/envoy
- image: docker.io/fluent/fluent-bit
  cpe: [treasuredata:fluent_bit]
  github: fluent/fluent-bit
- image: docker.io/gitea/gitea
  cpe: [gitea:gitea]
  github: go-gitea/gitea
- image: docker.io/gitlab/gitlab-runner
  cpe: [gitlab:runner, gitlab:gitlab_runner]
  gitlab: gitlab.com/gitlab-org/gitlab-runner
  policy: { track: minor }
- image: docker.io/goharbor/harbor-core
  cpe: [linuxfoundation:harbor]
  github: goharbor/harbor
- image: docker.io/grafana/grafana
  cpe: [grafana:grafana]
  eol: grafana
  github: grafana/grafana
  policy: { track: minor }
- image: docker.io/grafana/loki
  cpe: [grafana:loki]
  github: grafana/loki
- image: docker.io/hashicorp/consul
  cpe: [hashicorp:consul]
  eol: consul
  github: hashicorp/consul
- image: docker.io/hashicorp/vault
  cpe: [hashicorp:vault]
  eol: hashicorp-vault
  github: hashicorp/vault
- image: docker.io/istio/pilot
  cpe: [istio:istio]
  github: istio/istio
- image: docker.io/library/caddy
  cpe: [caddyserver:caddy]
  github: caddyserver/caddy
- image: docker.io/library/eclipse-temurin
  changelog: https://adoptium.net/temurin/release-notes/
  eol: eclipse-temurin
  # Java's long-term support releases come every two years, four versions apart (17, 21, 25, then 29).
  policy: { major_filter: '^(8|11|17|21|25|29|33|37)$' }
- image: docker.io/library/golang
  cpe: [golang:go]
  eol: go
  security: go.dev
  changelog: https://go.dev/doc/devel/release#go{version}
- image: docker.io/library/haproxy
  cpe: [haproxy:haproxy]
  eol: haproxy
  changelog: https://www.haproxy.org/download/{version}/src/CHANGELOG
- image: docker.io/library/mariadb
  cpe: [mariadb:mariadb]
  changelog: https://mariadb.com/kb/en/mariadb-{version}-release-notes/
  policy: { track: minor }
- image: docker.io/library/memcached
  cpe: [memcached:memcached]
  changelog: https://github.com/memcached/memcached/wiki/ReleaseNotes{version}
- image: docker.io/library/mongo
  cpe: [mongodb:mongodb]
  eol: mongodb
  changelog: https://www.mongodb.com/docs/manual/release-notes/
  policy: { track: minor }
- image: docker.io/library/mysql
  cpe: [oracle:mysql_server, oracle:mysql]
  changelog: https://dev.mysql.com/doc/relnotes/mysql/{version}/en/
  policy: { track: minor }
- image: docker.io/library/nats
  cpe: [linuxfoundation:nats-server]
  github: nats-io/nats-server
- image: docker.io/library/nginx
  cpe: [f5:nginx, f5:nginx_open_source]
  eol: nginx
  github: nginx/nginx
  github_tag_prefix: release-
- image: docker.io/library/node
  cpe: [nodejs:node.js]
  eol: nodejs
  github: nodejs/node
  github_tag_prefix: v
  # Even majors become long-term support releases; odd ones live six months.
  policy: { major_filter: '[02468]$' }
- image: docker.io/library/php
  advisories: php/php-src
  cpe: [php:php]
  eol: php
  security: php.net
  changelog: https://www.php.net/ChangeLog-8.php#{version}
- image: docker.io/library/postgres
  cpe: [postgresql:postgresql]
  changelog: https://www.postgresql.org/docs/release/{version}/
  policy: { track: minor }
- image: docker.io/library/python
  cpe: [python:python]
  changelog: https://docs.python.org/release/{version}/whatsnew/changelog.html#changelog
  eol: python
  security: eol-phase
- image: docker.io/library/rabbitmq
  cpe: [broadcom:rabbitmq_server, vmware:rabbitmq]
  eol: rabbitmq
  github: rabbitmq/rabbitmq-server
- image: docker.io/library/redis
  cpe: [redis:redis]
  github: redis/redis
- image: docker.io/library/registry
  cpe: [distribution_project:distribution, docker:registry]
  github: distribution/distribution
- image: docker.io/library/ruby
  cpe: [ruby-lang:ruby]
  changelog: https://www.ruby-lang.org/en/downloads/releases/#ruby-{version}
  eol: ruby
  security: eol-phase
- image: docker.io/library/traefik
  cpe: [traefik:traefik]
  github: traefik/traefik
- image: docker.io/library/ubuntu
  changelog: https://wiki.ubuntu.com/Releases
  eol: ubuntu
  # A server or base image moves from one LTS release to the next (24.04 -> 26.04), not to an interim release
  # supported for nine months (26.10); a service's own policy can say otherwise.
  policy: { tag_filter: '^[0-9][02468]\.04$' }
- image: docker.io/louislam/uptime-kuma
  cpe: [uptime.kuma:uptime_kuma, uptime-kuma_project:uptime-kuma]
  github: louislam/uptime-kuma
- image: docker.io/n8nio/n8n
  cpe: [n8n:n8n]
  github: n8n-io/n8n
  github_tag_prefix: 'n8n@'
- image: docker.io/opensearchproject/opensearch
  cpe: [amazon:opensearch]
  github: opensearch-project/OpenSearch
  policy: { track: minor }
- image: docker.io/outlinewiki/outline
  cpe: [getoutline:outline]
  github: outline/outline
- image: docker.io/prom/alertmanager
  cpe: [prometheus:alertmanager]
  github: prometheus/alertmanager
- image: docker.io/prom/node-exporter
  github: prometheus/node_exporter
- image: docker.io/prom/prometheus
  cpe: [prometheus:prometheus]
  github: prometheus/prometheus
- image: docker.io/vaultwarden/server
  cpe: [dani-garcia:vaultwarden]
  github: dani-garcia/vaultwarden
- image: docker.io/velero/velero
  cpe: [vmware:velero]
  github: vmware-tanzu/velero
- image: ghcr.io/dexidp/dex
  cpe: [linuxfoundation:dex]
  github: dexidp/dex
- image: ghcr.io/goauthentik/server
  cpe: [goauthentik:authentik]
  github: goauthentik/authentik
  github_tag_prefix: version/
- image: ghcr.io/immich-app/immich-server

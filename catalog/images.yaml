- image: ghcr.io/kyverno/kyverno
  cpe: [kyverno:kyverno, nirmata:kyverno]
  github: kyverno/kyverno
- image: ghcr.io/zitadel/zitadel
  cpe: [zitadel:zitadel]
  github: zitadel/zitadel
- image: mcr.microsoft.com/dotnet/aspnet
  eol: dotnet
  github: dotnet/runtime
  github_tag_prefix: v
  # Even majors are long-term support (three years), odd ones standard term support.
  policy: { major_filter: '[02468]$' }
- image: mcr.microsoft.com/dotnet/runtime
  eol: dotnet
  github: dotnet/runtime
  github_tag_prefix: v
  # Even majors are long-term support (three years), odd ones standard term support.
  policy: { major_filter: '[02468]$' }
- image: mcr.microsoft.com/dotnet/sdk
  eol: dotnet
  github: dotnet/runtime
  github_tag_prefix: v
  # Even majors are long-term support (three years), odd ones standard term support.
  policy: { major_filter: '[02468]$' }
- image: quay.io/argoproj/argocd
